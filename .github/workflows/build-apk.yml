name: Build Test APK - WSC 1.7 (17)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Protect the v1.6 repository
        run: |
          test "${GITHUB_REPOSITORY##*/}" = "wadhwa-sir-v1.7" || { echo "Use the v1.7 repository only"; exit 1; }
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install the exact locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build the web shell
        run: npm run build
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.4
      - name: Install SDK 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Generate a clean Android project from the pinned template
        run: |
          set -euo pipefail
          test ! -d android || { echo "Unexpected tracked android folder. Stop and review before replacing it."; exit 1; }
          test ! -f capacitor.config.json || { echo "Remove obsolete duplicate capacitor.config.json; use the supplied capacitor.config.ts only."; exit 1; }
          npx cap add android
          npx cap sync android
      - name: Configure AD_ID, Firebase, fullscreen, version and optimisation
        run: python3 tools/prepare_android.py
      - name: Preserve the existing launcher icon
        run: |
          set -euo pipefail
          test -f assets/icon.png
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick >/dev/null
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            density="${pair%:*}"
            size="${pair#*:}"
            folder="android/app/src/main/res/mipmap-$density"
            mkdir -p "$folder"
            for name in ic_launcher ic_launcher_round ic_launcher_foreground; do
              convert assets/icon.png -resize "${size}x${size}" "$folder/$name.png"
            done
          done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
      - name: Build the optimised release
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --stacktrace
      - name: Sign and verify the FINAL artifact
        env:
          WSC_KEYSTORE_PASSWORD: ${{ secrets.WSC_KEYSTORE_PASSWORD }}
          WSC_KEY_PASSWORD: ${{ secrets.WSC_KEY_PASSWORD }}
          WSC_KEY_ALIAS: ${{ secrets.WSC_KEY_ALIAS }}
        run: bash tools/sign_verify.sh apk
      - name: Upload only verified release files
        uses: actions/upload-artifact@v7.0.2
        with:
          name: WSC-1.7-17-apk-SIGNED
          path: release/
          if-no-files-found: error
          retention-days: 14
